name: Build Kaster for macOS

on:
  push:
    branches:
      - feature/research-card-editor-2026-11
      - feature/kaster-reference-ui-2026-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck Kaster source
        run: swiftc -target arm64-apple-macos13.0 -parse-as-library -typecheck Sources/*.swift
      - name: Run regression tests
        run: bash scripts/test.sh
      - name: Build universal Kaster application
        run: bash scripts/build.sh
      - name: Check application packaging
        run: |
          test -f build/Kaster.app/Contents/MacOS/Kaster
          test -f build/Kaster.app/Contents/Resources/AppIcon.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/Kaster.app/Contents/Info.plist)" = "Kaster"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' build/Kaster.app/Contents/Info.plist)" = "Kaster"
          lipo build/Kaster.app/Contents/MacOS/Kaster -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/Kaster.app
      - name: Package Kaster
        run: ditto -c -k --sequesterRsrc --keepParent build/Kaster.app build/Kaster-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kaster-Mac-universal
          path: build/Kaster-Mac.zip
          if-no-files-found: error
      - name: Create drag-and-drop Kaster DMG
        run: |
          mkdir -p build/dmg-root
          ditto build/Kaster.app build/dmg-root/Kaster.app
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname Kaster -srcfolder build/dmg-root -ov -format UDZO build/Kaster.dmg
          # DiskImages may briefly report an unavailable resource immediately
          # after image creation on shared macOS CI runners. Verification
          # must ultimately succeed; a corrupt image is never published.
          for attempt in 1 2 3 4 5; do
            if hdiutil verify build/Kaster.dmg; then
              echo "Kaster DMG verified."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "DMG verification failed after 5 attempts." >&2
              exit 1
            fi
            echo "DMG verification temporarily failed (attempt $attempt/5); retrying..."
            sleep 4
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Kaster-Mac-DMG
          path: build/Kaster.dmg
          if-no-files-found: error
