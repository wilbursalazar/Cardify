# Builds Kaster and runs every test on each push and pull request.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    # Current macOS (PDFKit on macOS 15 measures embedded system fonts differently).
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Typst (bundled into the app; the typesetting tests use it)
        run: brew install typst
      - name: Tool versions
        run: swift --version && typst --version
      - name: Build the app
        run: scripts/build.sh
      - name: Run the tests
        run: scripts/test.sh
